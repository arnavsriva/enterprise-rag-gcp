[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-gcp"
version = "0.1.0"
description = "Enterprise-style RAG over SEC 10-K filings on Google Cloud"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
# Dependencies are managed in requirements.txt (runtime) and requirements-dev.txt (dev/CI).

[tool.setuptools.packages.find]
include = ["common*", "ingest*", "rag*", "api*", "eval*"]

[tool.setuptools.package-data]
common = ["migrations/*.sql"]
ingest = ["corpus.toml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".terraform", "results"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "ASYNC",    # async pitfalls
  "S",        # bandit (security)
  "RUF",
]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy passwords are fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = false  # overrides below pre-declare libs used in later phases
exclude = ["^\\.venv/", "^infra/"]

[[tool.mypy.overrides]]
module = [
  "google.*",
  "vertexai.*",
  "llama_index.*",
  "langchain.*",
  "langchain_core.*",
  "langchain_google_genai.*",
  "kfp.*",
  "google_cloud_pipeline_components.*",
  "pgvector.*",
  "asyncpg.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not integration and not db'"
markers = [
  "integration: requires GCP credentials / billable resources (deselected by default)",
  "db: requires local Postgres + pgvector, see `make db-up` (deselected by default)",
]
