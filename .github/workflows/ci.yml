# CI: lint, unit tests, terraform fmt/validate.
# No cloud credentials, nothing billable. Terraform runs with -backend=false.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check ingest rag api eval tests

      - name: Ruff format check
        run: ruff format --check ingest rag api eval tests

      - name: Mypy
        run: mypy ingest rag api eval tests

      - name: Unit tests
        run: pytest

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform init (no backend)
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/envs/dev
        run: terraform validate
