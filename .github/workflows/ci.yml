# CI: lint, unit tests, terraform fmt/validate.
# No cloud credentials, nothing billable. Terraform runs with -backend=false.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check common ingest rag api eval tests

      - name: Ruff format check
        run: ruff format --check common ingest rag api eval tests

      - name: Mypy
        run: mypy common ingest rag api eval tests

      - name: Unit tests
        run: pytest

  db:
    name: db (migrations vs pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_PASSWORD: ci-only-password
      PG_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: DB tests
        run: pytest -m db

      - name: Migrations apply cleanly (twice)
        run: |
          python -m common.migrate
          python -m common.migrate

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform init (no backend)
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/envs/dev
        run: terraform validate
